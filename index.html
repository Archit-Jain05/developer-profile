<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Follows the device's light or dark setting until the visitor uses the
         switch (their choice is then remembered; the admin is always night). Set before the first paint so the page never flashes
         the other theme; useTheme.js takes over from here. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        // The visitor's own choice (the switch) wins; otherwise follow the device.
        var theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") theme = saved;
        } catch (e) {}
        if (location.pathname.indexOf("/admin") === 0) theme = "dark";
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
      })();
    </script>
    <meta name="description" content="Archit Jain is a software developer building apps for web and mobile." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for everything; Bodoni Moda italic for the occasional contrasting
         phrase and the surname. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..500&display=swap"
      rel="stylesheet"
    />
    <title>Archit Jain, software developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
